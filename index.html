<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f1" />
    <meta name="description" content="Тренажер 2801 найуживанішого англійського слова (NGSL)" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>NGSL Trainer</title>
    <script>
      // Тема до завантаження React — без спалаху світлого екрана.
      (function () {
        var theme = 'system';
        try {
          theme = localStorage.getItem('ngsl-theme') || 'system';
        } catch (e) {}
        if (theme === 'system') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
