name: Reminders

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Надіслати тестове нагадування всім підписаним зараз'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: reminders

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/send-reminders.ts
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      # GitHub вимикає розклад у репо без комітів 60 днів — щоразу підтверджуємо, що він потрібен.
      - name: Keep schedule enabled
        if: github.event_name == 'schedule'
        run: >
          curl -fsS -X PUT
          -H "Authorization: Bearer ${{ github.token }}"
          -H "Accept: application/vnd.github+json"
          "https://api.github.com/repos/${{ github.repository }}/actions/workflows/reminders.yml/enable"
